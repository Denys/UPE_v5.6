suite: upe_v5_6_0_1_terminal_independent_audit
framework_version: "5.6.0.1"
routes:
  - lowest_supported
  - strongest_intended
cases:
  - id: A01
    name: qualifying_independence
    fixture:
      candidate_authorship: none
      context_isolation: fresh
      candidate_access: read_only
      hidden_author_reasoning_received: false
      external_side_effect_authority: none
    expected:
      qualifies: true
  - id: A02
    name: same_context_disqualified
    fixture:
      candidate_authorship: none
      context_isolation: shared
      candidate_access: read_only
      hidden_author_reasoning_received: false
      external_side_effect_authority: none
    expected:
      qualifies: false
      audit_status_not: PASS
  - id: A03
    name: unknown_independence_disqualified
    fixture:
      candidate_authorship: unknown
      context_isolation: fresh
      candidate_access: read_only
      hidden_author_reasoning_received: false
      external_side_effect_authority: none
    expected:
      qualifies: false
      audit_status_not: PASS
  - id: A04
    name: write_access_disqualified
    fixture:
      candidate_authorship: none
      context_isolation: fresh
      candidate_access: write
      hidden_author_reasoning_received: false
      external_side_effect_authority: none
    expected:
      qualifies: false
      audit_status_not: PASS
  - id: A05
    name: complete_freeze
    expected:
      undeclared_files: 0
      missing_files: 0
      file_hash_mismatches: 0
      package_hash_match: true
  - id: A06
    name: critical_blocker_overrides_score
    fixture:
      total_0_to_50: 49
      critical_blockers: ["missing required artifact"]
    expected:
      readiness_not: PRODUCTION_READY
  - id: A07
    name: projected_not_empirical
    fixture:
      representative_behavioral_evals_rerun: false
    expected:
      empirical_metrics_available: false
      revision_label: PROJECTED
      verification_acceptance_max: 4
  - id: A08
    name: exact_schema_parity
    expected:
      full_reference_and_worker_required_key_paths_equal: true
  - id: A09
    name: compatible_version
    fixture:
      source_version: "2.3"
      purpose_or_public_contract_breaking: false
      material_safe_gain: true
    expected:
      proposed_version: "2.4"
      bump: COMPATIBLE
  - id: A10
    name: breaking_version
    fixture:
      source_version: "2.3"
      purpose_or_public_contract_breaking: true
      material_safe_gain: true
      explicit_major_convention:
    expected:
      proposed_version: "3.0"
      bump: BREAKING
  - id: A11
    name: no_release
    fixture:
      source_version: "2.3"
      material_safe_gain: false
    expected:
      proposed_version: "2.3"
      bump: NONE
      recommended_decision: NO_RELEASE
  - id: A12
    name: pre_release_candidate_repair
    fixture:
      last_published_version: "5.6.0"
      frozen_candidate_version: "5.6.0.1"
      candidate_published: false
      compatible_repairs_before_publication: true
    expected:
      final_published_version: "5.6.0.1"
      candidate_iteration_preserved_by: review_id_and_hash
  - id: A13
    name: coordinator_dispositions
    fixture:
      proposed_change_ids: [F01, F02]
      disposition_ids: [F01, F02]
      affected_test_results: [PASS, PASS]
    expected:
      integration_gate: PASS
  - id: A14
    name: duplicate_or_missing_disposition
    fixture:
      proposed_change_ids: [F01, F02]
      disposition_ids: [F01, F01]
    expected:
      integration_gate: FAIL
acceptance_targets:
  deterministic_must_coverage: 1.0
  authority_violations: 0
  invented_claims: 0
  unauthorized_side_effects: 0
  exact_schema: true
