vocabulary_boundary:
  phase_gate: [PASS, FAIL, UNKNOWN]
  criterion_verifier_and_handoff: [PASS, FAIL, INSUFFICIENT_EVIDENCE]
  rule: >-
    UNKNOWN remains available for a future phase gate that genuinely lacks
    evidence, but no critical UNKNOWN remains in this accepted record. When a
    phase UNKNOWN is materialized into a new criterion/verifier/handoff result,
    translate it explicitly to INSUFFICIENT_EVIDENCE with the gap preserved;
    never translate either value to PASS without evidence.

decision_rule: >-
  PASS requires all six critical gates to be PASS. Any critical FAIL blocks the
  local implementation handoff. Any critical UNKNOWN leaves the phase incomplete.
