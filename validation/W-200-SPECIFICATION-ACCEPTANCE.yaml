      - validation/W-200-CROSS-DOCUMENT-REVIEW.md#canonical-mapping
      - README.md#W-201W-210-canonical-mapping

  - id: G2-evidence-and-integrity
    critical: true
    verdict: PASS
    required_checks:
      - Current model/product claims are dated and source-grounded.
      - Source-copy identity and referenced repository paths are verified.
      - No implementation, test, App Server smoke, or external-action claim exceeds evidence.
      - Missing evidence remains UNKNOWN or INSUFFICIENT_EVIDENCE.
    evidence:
      - docs/work/MODEL_EFFORT_ROUTING.md#source-basis
      - handoffs/W-200-SPECIFICATION-CHECKPOINT.yaml#source_identity
      - validation/W-200-STATIC-VALIDATION.json#checks.example_repository_references

  - id: G3-feasibility-safety-delivery
    critical: true
    verdict: PASS
    required_checks:
      - Work, desktop Work, Local Codex, model, effort, Pro, orchestration, and tool boundaries are consistent.
      - Host-owned credentials, approvals, state, actions, recovery, and path security match ADR-001.
      - Single-agent v0, fake-adapter-first, and deferred-feature boundaries are preserved.
      - Local implementation brief is executable without hidden conversation context.
    evidence:
      - docs/work/SECURITY_THREAT_BOUNDARY.md
      - docs/work/RECOVERY_EVALUATION_OPERATIONS.md
      - validation/W-200-CROSS-DOCUMENT-REVIEW.md#contract-alignment
      - handoffs/W-200-LOCAL-IMPLEMENTATION-BRIEF.md

  - id: G4-yaml-and-schema-static-validation
    critical: true
    verdict: PASS
    required_checks:
      - Every YAML artifact parses as exactly one document.
      - All five JSON Schema documents have valid schema structure and unique identifiers.
      - Positive examples validate and required-field/type/enum/additional-property negative examples fail.
      - Schema references and repository paths resolve without network access.
    evidence:
      - validation/W-200-STATIC-VALIDATION.json
      - scripts/validate_work_specifications.py
      - examples/specifications/

  - id: G5-cross-document-consistency
    critical: true
    verdict: PASS
    required_checks:
      - Status and verdict vocabularies translate explicitly without conflation.
      - Goal, loop-state, verifier, capability, and handoff identifiers/reference fields align.
      - Approval, evidence, retry, checkpoint, completion, and stop semantics do not conflict.
      - W-209 cases cover the canonical list plus injection, approval, path, secret, crash, retry, duplicate-action, and unknown-evidence behavior.
      - W-210 separates surface, model tier, effort, Pro mode, orchestration, and tools.
    evidence:
      - validation/W-200-CROSS-DOCUMENT-REVIEW.md
      - validation/W-200-STATIC-VALIDATION.json#checks.cross_contract_examples
      - evals/work_loop_acceptance_cases.yaml#coverage

  - id: G6-local-handoff-readiness
    critical: true
    verdict: PASS
    required_checks:
      - The handoff names repository/ref verification, authoritative inputs, accepted outputs, constraints, unknowns, tests, rollback, and next canonical task.
      - The Windows-native ADR override of stale WSL2 backlog wording is explicit.
      - Future commit/push/PR/merge/release/deploy authority is not inferred from this phase.
    evidence:
      - handoffs/W-200-LOCAL-IMPLEMENTATION-BRIEF.md
      - handoffs/W-200-SPECIFICATION-CHECKPOINT.yaml
      - examples/specifications/local_implementation_goal.example.yaml
