    critical: true
    verdict: PASS
    required_checks:
      - Every canonical output exists at the backlog-defined path.
      - Every W-201 through W-210 completion criterion maps to inspectable content.
      - Supplemental phase artifacts are not misrepresented as canonical W tasks.
      - Scope exclusions and done conditions are explicit.
    evidence:
