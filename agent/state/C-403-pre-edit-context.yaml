interface_decisions:
  lifecycle_committer: >-
    A synchronous port commits each Run/Event pair and returns only after the
    caller's atomic recording boundary succeeds. C-403 proves call ordering;
    C-406 owns actual SQLite/outbox durability.
  lifecycle_coordinator:
    - creates deterministic stable transition IDs
    - calls C-401 transition_run and commits before returning the new Run
    - converts C-402 ProviderEvent values into canonical non-transition Event values
    - rejects backward provider timestamps, identity mismatch, and generic COMPLETED stops
  orchestrator:
    - initialize CREATED through INITIALIZING to READY around adapter startup/preflight/session creation
    - execute exactly one READY task through SELECTING_TASK and EXECUTING
    - commit EXECUTING before turn submission and commit each provider event before requesting the next
    - map provider success to VALIDATING and failure/interruption/cancellation/approval to reasoned stop states
    - finalize VALIDATING through optional EVALUATING and CHECKPOINTING to READY or COMPLETED only from explicit validation/checkpoint evidence
  worker_message_completion_allowed: false

acceptance_conditions:
  - CREATED reaches READY only after INITIALIZING is committed before adapter actions
  - one READY task is selected, recorded in Run.current_task_id, and submitted once per iteration
  - provider events become canonical ordered events without lifecycle metadata or raw payload leakage
  - success stops at VALIDATING until explicit validation/checkpoint evidence is supplied
  - optional evaluation and direct validation-to-checkpoint paths both reach CHECKPOINTING then READY
  - COMPLETED requires checkpoint plus explicit validation/completion evidence and PASS
  - approval, provider failure, interruption, cancellation, adapter error, and explicit host stops emit structured reasons
  - a failed commit prevents the following adapter action
  - focused/full pytest, Ruff, format, strict mypy, lock, reference, package, and diff checks pass
  - all pre-existing dirty and user-owned state remains unchanged and unstaged

