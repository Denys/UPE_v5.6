frozen_contract:
  - Deterministic validation is mandatory and precedes optional model evaluation.
  - Sufficient deterministic evidence suppresses evaluator invocation.
  - A deterministic FAIL cannot be overridden or waived by model output.
  - Only assigned irreducible criteria may be evaluated; criteria remain exact and ordered.
  - The evaluator has a read-only input/output interface and no mutation authority.
  - Criterion and aggregate verdicts remain PASS, FAIL, or INSUFFICIENT_EVIDENCE.
  - Real providers, prompt routing, persistence, retries, CLI behavior, and external effects are excluded.

