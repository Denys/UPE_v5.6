implemented:
  approvals:
    - immutable exact-scope approval record and dispatch check with stable audit reasons
    - exhaustive ActionClass taxonomy with local non-consequential actions distinct from consequential effects
    - GRANTED-only authorization bound to run, class, target, argument/content digests, repository, branch, effect count, decision identity, expiry, and dispatch time
    - denied, expired, revoked, pending, missing, malformed, future, unknown, ambiguous, and scope-drift cases fail closed
  command_and_environment_policy:
    - exact executable and argument-vector allowlists with assigned-cwd enforcement
    - bounded arguments, timeout, output and environment values
    - shell composition, variable expansion, inline credentials and non-explicit interpreters rejected
    - environment built only from an explicitly supplied mapping and non-credential key allowlist
  path_and_network_policy:
    - Windows drive-local lexical containment rejects traversal, sibling, UNC, device, ADS, glob, expansion and reserved-name forms
    - observed reparse components and cleanup are refused pending C-405 WorkspaceManager revalidation and separate authority
    - network denied by default and bound to exact scheme, host, port, purpose and caller-observed resolved destination
    - userinfo, fragments, redirects, malformed hosts/IPs, destination drift, unsafe separators and credential-bearing URLs are refused
  redaction:
    - recursive deterministic strings, bytes, mappings, sequences and exception normalization
    - secret-bearing keys/values, canaries, credentials, tokens, JWTs, PEM keys, URL userinfo, email and phone-like data redacted before transfer
    - cycles, excess depth and unsupported types fail closed to redaction markers
  boundary:
    - provider-neutral standard-library policy records are frozen and side-effect free
    - modules do not read the process environment, filesystem, credentials, DNS, network, provider, database or shell

