implemented:
  deterministic_first:
    - aggregate deterministic FAIL is returned unchanged and suppresses the evaluator
    - aggregate deterministic INSUFFICIENT_EVIDENCE is returned unchanged and suppresses the evaluator
    - aggregate deterministic PASS without a semantic request suppresses the evaluator
    - model invocation requires both deterministic PASS and an explicit frozen semantic request
  read_only_boundary:
    - immutable request, criterion, response, evaluator-identity, budget, correction, and outcome records
    - evaluator port receives references and frozen strings only, with no filesystem, process, network, persistence, approval, or mutation handle
    - evaluator identity requires independence, READ_ONLY access, and MODEL_EVALUATOR kind
  criteria_and_scope:
    - only mandatory unresolved semantic criteria may be assigned to the evaluator
    - response goal, task, goal-contract, artifact set, criterion IDs, order, statements, and mandatory flags must exactly match the request
    - criterion evidence references must be drawn only from supplied authoritative, artifact, deterministic-result, and goal-contract references
    - correction targets are restricted to supplied candidate artifacts and cannot target the frozen contract
    - any criterion at PASS or FAIL requires declared actual-artifact inspection, even when the aggregate is INSUFFICIENT_EVIDENCE
  verdicts:
    - criterion and aggregate outputs reject NOT_EVALUATED and preserve PASS, FAIL, or INSUFFICIENT_EVIDENCE
    - aggregate precedence is FAIL, then INSUFFICIENT_EVIDENCE, then all-PASS
    - W-207 evidence, correction, missing-evidence, and release-blocking invariants are enforced

excluded_behavior:
