implemented:
  path_policy:
    - absolute drive-local Windows paths only; UNC and device namespaces refused
    - traversal, sibling-prefix, root, nested, ADS, glob, environment-expansion, reserved-device, and trailing-dot/space targets refused
    - exact canonical direct-child containment with case-insensitive Windows comparison
    - every existing component inspected without following links; symlink/junction/reparse behavior refused
  identity_policy:
    - repository/worktree root filesystem identities captured and revalidated
    - assigned workspace filesystem identity captured and revalidated
    - deterministic owner token binds task, path, root/workspace identity, Git HEAD, and branch
  git_and_dirty_state:
    - read-only GitWorkspaceInspector port exposes only worktree inventory and status
    - assignment requires one exact unlocked registered worktree
    - staged, unstaged, and untracked paths retained without cleanup or data mutation
  cleanup_boundary:
    - prepare_cleanup returns an explicit immutable clean target and performs no effect
    - verify_cleanup_target rechecks ownership, path, filesystem identity, Git identity, and dirty status immediately before a separate effect
    - forged, unrelated, stale, late-dirty, locked, missing, or ambiguous targets fail closed

