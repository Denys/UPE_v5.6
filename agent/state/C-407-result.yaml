implemented:
  budgets:
    - immutable accounting for iterations, elapsed time, input/output/total tokens, and cost
    - exact-limit exhaustion plus a separate prospective overrun refusal
    - final exact-boundary dispatch is represented as allowed while subsequent dispatch is blocked
    - input/output token components derive total consumption so total-token limits cannot be bypassed
    - configured dimensions are host-enforced while absent dimensions remain unenforced
  retries:
    - transient-only retry classification with retries counted after the initial attempt
    - capped exponential backoff with deterministic bounded jitter and overflow-safe cap selection
    - deterministic validation requires repair; permanent/policy and approval classes stop explicitly
    - already-exhausted budgets block retry before a delay is returned
  progress:
    - stable failure, validator, artifact/diff, criteria, dependency, and approval signals
    - independent consecutive identical-failure and no-progress thresholds
    - measurable progress resets only the no-progress counter
    - no-progress attempts cannot replace the last stable checkpoint or evidence references
  action_safety:
    - successful actions are never retried
    - ambiguous non-idempotent actions require matching action/target identities, evidence, and a reconciled FAILED or NOT_STARTED outcome
    - unresolved or reconciled-success outcomes remain blocked
  boundary:
    - frozen runtime-validated public records and decisions
    - pure synchronous policy with no filesystem, subprocess, network, provider, database, sleep, or external effect

local_review_repairs:
  - derived total-token usage when callers omit total_tokens
