schema_version: '1.0'
handoff_id: C-502-BOUNDED-LIVE-SMOKE-RERUN-2026-07-28
task_id: C-502
status: AUTHORIZED_PENDING_PR_26_INTEGRATION

objective: >-
  Run one bounded Windows-native Codex App Server lifecycle smoke against the
  C-501 correction merged by PR 25. Prove initialize, thread, turn, tool
  approval, interrupt, resume/reconnect, event and terminal behavior while
  allowing mutation only inside the generated C-305 fixture repository.

authorization:
  source: user request in the GitHub-connected UPE conversation
  date: '2026-07-28'
  permits:
    - create one fresh isolated worktree and branch
    - start the local Codex App Server for one bounded lifecycle attempt
    - run one primary fixture turn and at most two non-mutating control turns
    - exercise one tool approval, one interrupt and one thread resume/reconnect
    - run fixture-local deterministic validation
    - record local evidence and prepare a task-scoped pull request
  excludes:
    - release or deployment
    - production or unrelated repository mutation
    - network or external-service actions initiated by the smoke task
    - C-503 recovery implementation
    - modification or deletion of prior C-502 attempt evidence
    - merge without a separate exact-head review and passing checks
  scope_basis:
    - user request dated 2026-07-28 to complete the missing C-501/C-502 steps
    - docs/architecture/ADR-001-harness-boundary.md controlled-smoke contract

execution_gate:
  required_before_start:
    - PR 26 is merged into main after passing local checks and exact-head review.
    - Current origin/main contains both the PR 25 merge and the accepted PR 26 merge.
    - The canonical current state and readiness report agree that this attempt is authorized.
  live_compatibility_before_start: UNKNOWN
  C503_before_start: BLOCKED

baseline:
  repository: Denys/UPE_v5.6
  required_main_ancestor: b20aa4304e61d12e6460e92fccb5b63d9560eb43
  C501_pull_request: 25
  C501_candidate_commit: 4d942ba6c07712d5fa8c147f4b2822ed64ba6a5a
  C501_gate: validation/C-501-GATE.yaml
  expected_codex_cli: 0.144.3
  expected_protocol: codex-app-server-unversioned-jsonl
  supported_observed_python: 3.14.3

prior_attempt:
  treatment: immutable_historical_failure
  failure_stage: initialize_response_parse
  failure_cause: old_adapter_required_invented_jsonrpc_member
  superseded_cause_repaired_by: PR_25
  hashes:
    result_sha256: b4f0309b24cef482648984679b038e93fa4c967f859ce806da8c53ee3eba0182
    gate_sha256: b3dad269ad2aa4d060382be1a25b2ac4131b646d6083a393522ab5d3e79f9765
    observation_sha256: 2f67e7f947dbc5b05bcd5fd20ba04d445414059077c686c44d3a1f943c376d49
    validator_sha256: 1f02cd3c7a31470dc346f089bbe0db749297acdabbcb1f26258ea1f4655076e3

execution_boundary:
  surface: local_codex_windows
  branch: codex/c502-app-server-smoke-rerun-20260728
  worktree: fresh_isolated_worktree_required
  fixture_bootstrap: scripts/bootstrap.sh
  fixture_repository: examples/fixture-repository/.fixture-output/repository
  allowed_mutation_roots:
    - examples/fixture-repository/.fixture-output/repository
    - evals/results/app-server-smoke/attempt-002
    - agent/state/C-502-result.yaml
    - validation/C-502-GATE.yaml
    - docs/research/app-server-smoke-observation.md
  protected_roots:
    - primary user checkout and unrelated worktrees
    - docs/research/generated-app-server-schema
    - prior C-502 worktree and evidence artifacts
    - production, network and external systems

preflight:
  - Verify origin/main contains required_main_ancestor and create the worktree from current origin/main.
  - Record exact branch, HEAD, dirty state, worktrees, Python, uv, Git and Codex CLI identities.
  - Require codex-cli 0.144.3 and `codex app-server --help` exit 0; stop on mismatch.
  - Bootstrap the C-305 fixture and verify its exact Git root and clean baseline.
  - Run the focused C-501 adapter tests before the live smoke.
  - Refuse credentials or broad environment inheritance not required by the smoke.

smoke_contract:
  maximum_app_server_processes: 1
  maximum_threads: 1
  maximum_turns: 3
  maximum_fixture_mutating_turns: 1
  scenarios:
    - id: approval_and_fixture_change
      task: >-
        Request one harmless deterministic text-file change inside the generated
        fixture repository. Observe the approval request, verify its exact
        thread, turn, item and path scope, allow it once, then run only the
        predeclared C-305 fixture validator.
      required_terminal: completed
    - id: interrupt
      task: >-
        Start a non-mutating bounded turn, interrupt it after the first
        correlated non-terminal event, and require an interrupted terminal.
      required_terminal: interrupted
    - id: resume_reconnect
      task: >-
        Resume the same thread through the adapter, verify the returned thread
        identity, submit one non-mutating confirmation turn, and require exactly
        one completed terminal without repeating the fixture mutation.
      required_terminal: completed
  required_observations:
    - initialize response accepted and exact CLI/schema pin confirmed
    - initialized notification sent
    - one thread created
    - one exact-scope approval request observed and answered once
    - interrupt request correlated to the active thread and turn
    - interrupted terminal observed for the interrupted turn
    - thread resume/reconnect returns the original thread identity
    - each turn has ordered provider events and exactly one terminal outcome
    - only fixture-local change observed
    - deterministic validator result recorded
    - App Server process stopped cleanly
  approval_policy:
    fixture_local_read: allow
    fixture_local_write: allow_only_when_exact_path_and_scope_match
    command_execution: allow_only_the_predeclared_fixture_validator
    network: deny
    external_or_unrelated_write: deny_and_stop

stop_conditions:
  - Git baseline does not contain PR 25 merge commit.
  - CLI, schema or protocol identity differs from the accepted pin.
  - Any response or notification is malformed, ambiguous or mismatched.
  - The provider requests an action outside the exact fixture scope.
  - More than one thread, three turns or one App Server process would be required.
  - The approval request is absent, duplicated, uncorrelated or outside the exact fixture scope.
  - Interrupt does not produce one correlated interrupted terminal.
  - Resume/reconnect changes thread identity or repeats the fixture mutation.
  - Any terminal state is missing, duplicated or ambiguous.
  - Validator evidence cannot be tied to the observed fixture diff.
  - Any secret, credential value or unrelated user artifact would be exposed or modified.

outputs:
  attempt_directory: evals/results/app-server-smoke/attempt-002
  required_files:
    - evals/results/app-server-smoke/attempt-002/run-summary.json
    - evals/results/app-server-smoke/attempt-002/events.jsonl
    - evals/results/app-server-smoke/attempt-002/approval-result.json
    - evals/results/app-server-smoke/attempt-002/interrupt-result.json
    - evals/results/app-server-smoke/attempt-002/reconnect-result.json
    - evals/results/app-server-smoke/attempt-002/fixture-diff.patch
    - evals/results/app-server-smoke/attempt-002/validator-result.json
    - docs/research/app-server-smoke-observation.md
    - agent/state/C-502-result.yaml
    - validation/C-502-GATE.yaml
  evidence_rules:
    - redact model text, stderr and environment values to bounded references where not required for acceptance
    - record SHA-256 for every result artifact
    - preserve the prior attempt hashes verbatim
    - distinguish observed execution from inference and retained PR 25 evidence

pass_requires:
  - all preflight checks pass
  - all required observations exist
  - approval, interrupt and resume/reconnect scenarios each satisfy their terminal contract
  - fixture-only mutation is proven
  - validator passes
  - no external or unrelated mutation occurs
  - result and gate both identify the exact main baseline and attempt-002 hashes
  - a fresh exact-head read-only review finds no blocker

failure_policy:
  - Record FAIL or UNKNOWN at the first unmet mandatory condition.
  - Preserve partial evidence and stop the App Server process.
  - Do not retry unchanged.
  - Do not unblock C-503 unless this attempt reaches PASS.
