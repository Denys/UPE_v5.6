scope:
  in_scope:
    - >-
      Adapt, commit and validate the repository-owned attempt-002 runner,
      validator and offline integration test before starting App Server.
    - >-
      Run one Windows-native App Server process, one thread, one fixture-mutating
      turn and at most two non-mutating control turns.
    - >-
      Prove initialize, thread/turn, exact-scope tool approval, interrupt,
      resume/reconnect, ordered events, one terminal per turn and clean process
      shutdown.
    - >-
      Bootstrap and mutate only the generated C-305 fixture repository, run only
      its predeclared deterministic validator, and persist bounded attempt-002
      evidence.
    - >-
      Record PASS, FAIL or INSUFFICIENT_EVIDENCE without retrying an unchanged
      failed scenario, then update canonical state, the C-502 gate and the
      derived readiness report.
  out_of_scope:
    - Release, deployment, production use or repository visibility changes.
    - C-503 crash/restart recovery implementation.
    - Any mutation of the primary user checkout, unrelated worktrees or systems.
    - Any modification or deletion of retained C-502 attempt-001 evidence.
    - Any smoke-task network or external-service action.
  allowed_paths:
    - scripts/run_c502_app_server_smoke.py
    - scripts/validate_c502_app_server_smoke.py
    - tests/integration/test_c502_app_server_smoke.py
    - examples/fixture-repository/.fixture-output/repository
    - examples/fixture-repository/.fixture-output.owner
    - evals/results/app-server-smoke/attempt-002
    - docs/research/app-server-smoke-observation.md
    - agent/state/C-502-result.yaml
    - validation/C-502-GATE.yaml
    - docs/research/research-state.yaml
    - UPE_5.6.0_to_5.6.1_capability_readiness_report_2026-07-19.html
  forbidden_actions:
    - Start before PR 26 is merged and present in the new worktree baseline.
    - Start App Server before the repository-owned tooling passes offline tests and focused pre-live inspection.
    - Use more than one App Server process, one thread, three turns or one fixture-mutating turn.
    - Send network requests or perform external-service actions from the smoke task.
    - Expose credentials, secret values, broad environment state or unrelated user artifacts.
    - Modify any path outside scope or alter retained attempt-001 evidence.
    - Continue after a malformed, ambiguous, duplicated, mismatched or uncorrelated provider event.
    - Retry an unchanged failed or unknown external action.
    - Merge, release, deploy or change visibility without new exact-scope approval.

must_requirements:
  - must_id: MUST-C502-preflight
    statement: >-
      From a fresh isolated worktree based on current origin/main, prove that the
      baseline contains PR 25 and the exact reviewed content merged through PR
      26. Resolve every `post-merge-main@contains-PR-26-reviewed-content` input
      from that single baseline and compare its tracked content, without
      requiring feature-branch SHA ancestry after a squash merge. Record exact
      branch, HEAD, dirty state, worktrees, Python, uv, Git and Codex identities;
      require Codex CLI 0.144.3 and a successful app-server help probe; bootstrap
      a clean C-305 fixture and pass the focused C-501 tests.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-run-summary
      - OUT-C502-validator
      - OUT-C502-fixture-owner-marker
    evidence_refs: []
  - must_id: MUST-C502-bounds
    statement: >-
      Use at most one App Server process, one thread, three turns and one
      fixture-mutating turn; stop rather than widening any bound.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-run-summary
      - OUT-C502-events
    evidence_refs: []
  - must_id: MUST-C502-tooling-readiness
    statement: >-
      Adapt and commit the repository-owned complete-lifecycle runner, artifact
      validator and offline integration test on the task-scoped post-merge C-502
      branch. Pass their deterministic tests without starting App Server and
      clear one focused pre-live inspection before consuming attempt-002.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-runner-source
      - OUT-C502-validator-source
      - OUT-C502-integration-test
    evidence_refs: []
  - must_id: MUST-C502-initialize
    statement: >-
      Accept the unversioned JSONL initialize response, confirm the exact
      CLI/schema pin, send initialized, create exactly one thread, and preserve
      correlation and event order.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-run-summary
      - OUT-C502-events
    evidence_refs: []
  - must_id: MUST-C502-approval
    statement: >-
      Request one harmless deterministic text-file change in the generated
      fixture; observe one exact thread, turn, item and path-scoped approval,
      answer it once, and permit only the predeclared fixture validator.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-approval
      - OUT-C502-events
      - OUT-C502-fixture-diff
      - OUT-C502-validator
    evidence_refs: []
  - must_id: MUST-C502-interrupt
    statement: >-
      Start one bounded non-mutating turn, interrupt it after its first
      correlated non-terminal event, and observe exactly one interrupted
      terminal for that turn.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-interrupt
      - OUT-C502-events
    evidence_refs: []
  - must_id: MUST-C502-reconnect
    statement: >-
      Resume or reconnect the same thread through the adapter, verify the
      original thread identity, submit one non-mutating confirmation turn, and
      observe exactly one completed terminal without repeating fixture mutation.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-reconnect
      - OUT-C502-events
    evidence_refs: []
  - must_id: MUST-C502-containment
    statement: >-
      Prove that only the generated fixture changed, that the deterministic
      validator result matches that diff, that no external mutation occurred,
      and that the App Server process stopped cleanly. After capturing the
      observed edit, run exactly `C:\Program Files\Git\usr\bin\bash.exe
      scripts/verify-fast.sh` and `C:\Program Files\Git\usr\bin\bash.exe
      scripts/verify-full.sh`; require exit 0 plus `fixture_verify_fast=PASS` or
      `fixture_verify_full=PASS` and `exit_code=0`. Do not rerun bootstrap after
      the edit because it recreates the fixture repository.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-run-summary
      - OUT-C502-fixture-diff
      - OUT-C502-validator
      - OUT-C502-fixture-owner-marker
    evidence_refs: []
  - must_id: MUST-C502-evidence
    statement: >-
      Produce all attempt-002 outputs, record SHA-256 for every result artifact,
      redact unneeded model text, stderr and environment values, preserve the
      four attempt-001 hashes verbatim, and separate observation from inference
      and retained PR 25 evidence.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-run-summary
      - OUT-C502-events
      - OUT-C502-approval
      - OUT-C502-interrupt
      - OUT-C502-reconnect
      - OUT-C502-fixture-diff
      - OUT-C502-validator
      - OUT-C502-observation
    evidence_refs: []
  - must_id: MUST-C502-state
    statement: >-
      Update the C-502 result, gate, canonical research state and observation
      with the exact main baseline and attempt-002 hashes; regenerate and check
      the derived readiness report; keep C-503 blocked unless every critical
      condition passes.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-result
      - OUT-C502-gate
      - OUT-C502-state
      - OUT-C502-observation
      - OUT-C502-readiness-report
    evidence_refs: []
  - must_id: MUST-C502-review
    statement: >-
      After deterministic checks, obtain a fresh exact-head read-only review;
      merge remains a separately authorized action.
    critical: true
    status: PENDING
    output_refs:
      - OUT-C502-gate
      - OUT-C502-state
    evidence_refs: []

