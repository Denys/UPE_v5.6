confirmed_decisions:
  - ChatGPT Work owns research, specification, gates, review, and handoff; the trusted host owns runtime enforcement.
  - Windows-native Codex is the current target; WSL2 language in C-302 is superseded by ADR-001.
  - SQLite plus transactional outbox is authoritative; JSONL is repairable and deduplicated.
  - External actions use stable action identities, scoped approvals, and reconciliation before retry.
  - Deterministic validation precedes an optional read-only verifier.
  - Routine checkpoints are host snapshots; Git commits are separately approval-gated.
  - v0 remains single-agent and fake-adapter first.

