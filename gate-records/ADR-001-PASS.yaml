criteria:
  - id: contract
    status: PASS
    evidence: Every mandatory architecture boundary and v0 exclusion maps to ADR sections 1 through 10.
  - id: documented_vs_observed
    status: PASS
    evidence: Official intended behavior and installed Windows/Codex 0.144.3 observations are explicitly separated.
  - id: runtime_target
    status: PASS
    evidence: The host contract is portable while Windows-native is the current implementation target; WSL2 is not an active dependency.
  - id: provider_boundary
    status: PASS
    evidence: App Server is isolated behind a version-pinned adapter with schema preflight and a live lifecycle smoke-test condition.
  - id: state_and_recovery
    status: PASS
    evidence: SQLite is authoritative; JSONL is emitted through a transactional outbox and repaired by replay. External actions use an action journal and reconciliation before retry.
  - id: checkpoint_authority
    status: PASS
    evidence: Routine rollback uses host-managed snapshots; Git commits remain explicit approval-gated actions.
  - id: validation
    status: PASS
    evidence: Deterministic environmental checks precede optional read-only model evaluation.
  - id: security_and_approvals
    status: PASS
    evidence: Host authority and all consequential approval classes are explicit; legacy merge is not treated as authorization.
  - id: portability
    status: PASS
    evidence: Core contracts exclude raw App Server protocol and permit a future adapter without core-model changes.
  - id: scope
    status: PASS
    evidence: Multi-agent, scheduler, UI, issue tracker, autonomous release and self-modification remain deferred.
  - id: critical_conflicts
    status: PASS
    evidence: Windows/WSL, App Server maturity, dual-write recovery and checkpoint-approval conflicts are resolved. Remaining unknowns are phase-bounded.
non_blocking_unknowns:
