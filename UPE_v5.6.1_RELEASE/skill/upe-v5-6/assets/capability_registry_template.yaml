registry_version: 3
framework_version: "5.6.1"
project:
surface:
last_verified: YYYY-MM-DD
verification_source:

capabilities:
  - id:
    name:
    kind: built_in_tool | skill | plugin | app | connector | mcp | repository | artifact | browser | agent | automation
    status: available | installed | connected | disabled | blocked | unknown
    surfaces: []
    purpose:
    triggers: []
    non_triggers: []
    prerequisites: []
    inputs: []
    outputs: []
    data_scope:
    action_scope: read_only | transform_only | draft | write | consequential | irreversible
    review_independence:
      candidate_authorship: none | partial | full | unknown
      context_isolation: fresh | shared | unknown
      candidate_access: read_only | write | unknown
      # Deprecated v2 alias retained for compatibility:
      mutable_candidate_access: none | read_only | write | unknown
      hidden_author_reasoning_received: false | true | unknown
      external_side_effect_authority: none | present | unknown
      enforcement:
      qualifies: true | false | unknown
    approval: none | once_per_task | per_action | strict_confirmation
    side_effects: []
    validation:
    fallback:
    source_of_truth:
    last_verified: YYYY-MM-DD
    notes:

selection_defaults:
  prefer_existing_skill_or_plugin: true
  expose_narrowest_useful_tool_set: true
  structured_retrieval_before_ui: true
  deterministic_tools_for_deterministic_work: true
  external_writes_require_authorization: true
  side_effects_centralized: true
  unavailable_capabilities_must_not_be_implied: true

project_capability_plan:
  bottlenecks: []
  required: []
  optional: []
  avoid_or_disable: []
  selected_cognitive_adapter:
  selected_tool_adapter:
  independent_review:
    required: false
    selected_route:
    qualifies: false
    evidence:
      candidate_authorship: none | partial | full | unknown
      context_isolation: fresh | shared | unknown
      candidate_access: read_only | write | unknown
      hidden_author_reasoning_received: false | true | unknown
      external_side_effect_authority: none | present | unknown
      enforcement:
    candidate_freeze_method:
    manifest_algorithm: "sha256(sorted '<hash><two spaces><relative_posix_path><LF>' records; manifest excluded)"
    fallback_handoff:
    status: NOT_REQUIRED | PENDING | PASS | FAIL | UNKNOWN
  residual_limits: []
