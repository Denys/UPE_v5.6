[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "upe-harness"
version = "0.1.0"
description = "Minimal trusted-host harness for long-running Codex software-engineering tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = [
  "jsonschema[format]>=4.23,<5",
  "mypy>=1.14,<2",
  "PyYAML>=6,<7",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
  "types-PyYAML>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--basetemp=.pytest-tmp", "-ra"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "scripts/validate_work_specifications.py",
  "UPE_v5.6.0_RELEASE/skill/upe-v5-6/scripts/validate_package.py",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
