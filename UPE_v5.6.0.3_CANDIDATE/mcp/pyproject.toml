[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "upe-review-mcp"
version = "5.6.0.3"
description = "Host-enforced UPE reviewer/rework loop exposed as a tool-only MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.28.1,<2",
  "openai-agents>=0.18.3,<0.19",
  "pydantic>=2.11,<3",
]

[project.scripts]
upe-review-mcp = "upe_review_mcp.app:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/upe_review_mcp"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
