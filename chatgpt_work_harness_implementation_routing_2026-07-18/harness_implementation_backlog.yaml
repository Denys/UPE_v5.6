current_state:
  research: PASS
  implementation: NOT_STARTED
  next_action:
  - C-101
  - C-102
  broad_implementation_gate: G-ADR
  local_work_critical_path: false
routing_invariant: Use ChatGPT Work web whenever uploaded/connected/cloud sources and reviewable artifacts suffice;
  use local Work only for private local non-repository files/apps/UI evidence; use local Codex for Git, shell, tests,
  worktrees, typed durable state, App Server, recovery, security and executable proof.
model_routing:
  sol_high: Default for clear, bounded research/specification/implementation with observable checks.
  sol_max_or_highest_exposed: Use only for unresolved architecture interactions, state/recovery/idempotency, security/permissions,
    App Server event ordering/versioning, hard failures surviving High, or final multi-component integration.
  sol_pro: 'Use in ChatGPT/Work for difficult indivisible judgment: ADR-001 and fresh read-only release review;
    not equivalent to max effort.'
  ultra: Not used for v0 runtime. Read-only independent research branches only when genuinely separable.
approval_boundaries:
- No commit without explicit user authorization.
- No push, pull request, merge, release, deployment, external message, purchase, or production mutation.
- No broad credential inheritance into the agent workspace.
- Network access only for a documented need and within narrow policy.
