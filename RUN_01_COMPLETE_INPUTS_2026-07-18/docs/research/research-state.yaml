    - 30 live official sources listed in docs/research/source-matrix.md
  findings:
    - Codex App Server is the minimum reliable v0 execution boundary; rebuilding Codex core in Agents SDK is not justified.
    - The trusted host must own durable state, credentials, budgets, approvals, audit, retry/idempotency, and recovery.
    - Deterministic validation precedes any independent model evaluator.
    - Work is a capable research/deliverable/steering/review surface, not merely a passive UI.
    - Work conversation and Goal state remain supporting context; versioned artifacts are the cross-surface source of truth.
    - Single-agent v0 remains supported; planner and multi-agent execution are deferred pending representative eval evidence.
  completed:
    - Opened and classified all 30 requested live pages/repositories.
    - Recorded exact current commits for Codex, Symphony, Agents SDK Python, CWC long-running agents, and Claude quickstarts.
    - Created source matrix, ten-way pattern comparison, Work applicability memo, package README, and validation manifest.
  unresolved:
    - Merge with Codex-side direct WSL2/repository observations and commands.
    - Inspect the named local files not found under their exact names: CIDP_AGENTS.md, repository README.md, 01_OPENAI_SURFACE_MAP__reference.md, 02_OFFICIAL_SOURCE_MAP__OpenAI.md, and 03_GPT_5_6_MODEL_AND_EFFORT_ROUTING__reference.md.
    - Verify the exact installed Codex/App Server release or binary used for the future smoke test; repository commit inspection is not a runtime test.
    - Confirm feature-specific Work maturity labels where OpenAI exposes them; unspecified maturity remains UNKNOWN.
  verification:
    method:
      - deterministic row and heading counts
      - required-field/header checks
      - exact source-ID sequence check
      - local Markdown link syntax scan
      - YAML parse
      - SHA-256 manifest generation
    result: PASS
    note: Content correctness remains source-grounded research; no target-environment execution has been claimed.
  recovery:
