      - docs/research/source-matrix.md
      - docs/research/pattern-comparison.md
      - docs/research/chatgpt-work-applicability.md
      - docs/research/research-state.yaml
    resume_rule: >-
      Reopen the four canonical files, compare Codex-side findings by stable source ID
      and exact commit/version, resolve conflicts by authority and evidence, then draft
      ADR-001 without restarting verified research.
  next_action: >-
    Merge Codex direct research into this source-indexed package and write
    docs/architecture/ADR-001-harness-boundary.md; do not begin broad implementation before ADR acceptance.
