  findings:
    - Codex App Server remains the minimum v0 execution boundary; rebuilding Codex core in Agents SDK is not justified.
    - The trusted-host contract is portable, while Windows-native Codex is the current v0 target. Earlier WSL2-first text is historical context, not an active dependency.
    - The installed App Server surface is pinned to Codex CLI 0.144.3 and schema-validated; a live lifecycle smoke test remains required before adapter completion.
    - SQLite is authoritative state and uses a transactional outbox to produce a replayable and deduplicated JSONL audit mirror.
    - Potentially non-idempotent external actions use stable action IDs, recorded approval scope and reconciliation before retry.
    - Routine rollback uses host-managed patch snapshots; Git commits are explicit approval-gated milestones.
    - Deterministic validation precedes any read-only model evaluator.
    - Single-agent v0 remains mandatory; planner, evaluator loops and multi-agent execution require representative eval evidence.
    - The legacy-upstream merge is a recorded safety incident, not authorization for target-repository merge or release.
  completed:
    - Opened and classified all 30 requested live pages and repositories.
    - Materialized the build brief and four accepted research files at canonical repository paths.
    - Merged Windows-native repository, runtime and App Server observations for C-101 through C-105.
    - Rechecked critical current official sources for App Server, harness engineering, Symphony, Agents SDK and evaluation design.
    - Created the environment conflict log, ADR evidence packet and ADR-001.
    - Applied the ADR gate.
    - Completed a fresh-context Pro review.
    - Repaired SQLite/JSONL crash consistency, external-action recovery and checkpoint-approval ambiguity.
    - Removed temporary scratch files from the delivery branch.
  unresolved:
