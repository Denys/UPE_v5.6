$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/Denys/UPE_v5.6/schemas/work_loop_state.schema.yaml
title: UPE Work Loop State
description: >-
  Compact, versioned project-level checkpoint for resuming a ChatGPT Work loop.
  This artifact references trusted-host state when present; it is not the host
  SQLite schema and does not replace the transactional outbox or action journal.
type: object
additionalProperties: false
required:
  - schema_version
  - state_id
  - goal_id
  - run_id
  - goal_contract_ref
  - status
  - completion_verdict
  - iteration
  - completed
  - evidence
  - failed_checks
  - remaining
  - approvals_needed
  - budget
  - durability
  - checkpoint_ref
  - next_action
  - stop_reason
  - updated_at
properties:
  schema_version:
    const: 1.0.0
  state_id:
    $ref: '#/$defs/stableId'
  goal_id:
    $ref: '#/$defs/stableId'
  run_id:
    $ref: '#/$defs/stableId'
  goal_contract_ref:
    $ref: '#/$defs/locationReference'
  status:
    enum:
      - RUNNING
      - REVIEW_REQUIRED
      - BLOCKED
      - APPROVAL_REQUIRED
      - COMPLETED
      - BUDGET_EXHAUSTED
      - FAILED
      - CANCELLED
  completion_verdict:
    enum:
      - PASS
      - FAIL
      - INSUFFICIENT_EVIDENCE
      - NOT_EVALUATED
  iteration:
    type: object
    additionalProperties: false
    required:
      - current
      - maximum
      - last_progress_at
      - identical_failure_count
      - no_progress_count
    properties:
      current:
        type: integer
        minimum: 0
      maximum:
        type: [integer, 'null']
        minimum: 1
      last_progress_at:
        type: [string, 'null']
        format: date-time
      identical_failure_count:
        type: integer
        minimum: 0
      no_progress_count:
        type: integer
        minimum: 0
  completed:
    type: array
    items:
      $ref: '#/$defs/completedItem'
  evidence:
    type: array
    items:
      $ref: '#/$defs/evidenceReference'
  failed_checks:
    description: Current unresolved failed or insufficient-evidence checks.
    type: array
    items:
      $ref: '#/$defs/failedCheck'
  remaining:
    type: array
    items:
      $ref: '#/$defs/remainingItem'
  approvals_needed:
    description: Unresolved approvals only; granted approvals are referenced as evidence.
    type: array
    items:
      $ref: '#/$defs/pendingApproval'
  budget:
    $ref: '#/$defs/budgetState'
  durability:
    $ref: '#/$defs/durabilityState'
  checkpoint_ref:
    anyOf:
      - $ref: '#/$defs/locationReference'
      - type: 'null'
  next_action:
    anyOf:
      - $ref: '#/$defs/nextAction'
      - type: 'null'
  stop_reason:
    anyOf:
      - $ref: '#/$defs/stopReason'
      - type: 'null'
  updated_at:
    type: string
    format: date-time
allOf:
  - if:
      properties:
        status:
          not:
            const: COMPLETED
      required:
        - status
    then:
      properties:
        completion_verdict:
          enum:
            - FAIL
            - INSUFFICIENT_EVIDENCE
            - NOT_EVALUATED
  - if:
      properties:
        status:
          const: RUNNING
      required:
        - status
    then:
      properties:
        completion_verdict:
          const: NOT_EVALUATED
        next_action:
          $ref: '#/$defs/nextAction'
        stop_reason:
          type: 'null'
  - if:
      properties:
        status:
          const: COMPLETED
      required:
        - status
    then:
      properties:
        completion_verdict:
          const: PASS
        completed:
          type: array
          minItems: 1
        evidence:
          type: array
          minItems: 1
        failed_checks:
          type: array
          maxItems: 0
        remaining:
          type: array
          maxItems: 0
        approvals_needed:
          type: array
          maxItems: 0
        next_action:
          type: 'null'
        stop_reason:
          allOf:
            - $ref: '#/$defs/stopReason'
            - type: object
              properties:
                code:
                  const: COMPLETED
  - if:
      properties:
        status:
          const: APPROVAL_REQUIRED
      required:
        - status
    then:
      properties:
        approvals_needed:
          type: array
          minItems: 1
        next_action:
          $ref: '#/$defs/nextAction'
        stop_reason:
          allOf:
            - $ref: '#/$defs/stopReason'
            - type: object
              properties:
                code:
                  const: APPROVAL_REQUIRED
  - if:
      properties:
        status:
          const: BUDGET_EXHAUSTED
      required:
        - status
    then:
      properties:
        budget:
          allOf:
            - $ref: '#/$defs/budgetState'
            - type: object
              properties:
                exhausted_dimensions:
                  type: array
                  minItems: 1
        next_action:
          $ref: '#/$defs/nextAction'
        stop_reason:
          allOf:
            - $ref: '#/$defs/stopReason'
            - type: object
              properties:
                code:
                  const: BUDGET_EXHAUSTED
  - if:
      properties:
        status:
          const: REVIEW_REQUIRED
      required:
        - status
    then:
      properties:
        next_action:
          $ref: '#/$defs/nextAction'
        stop_reason:
          allOf:
            - $ref: '#/$defs/stopReason'
            - type: object
              properties:
                code:
                  const: REVIEW_REQUIRED
  - if:
      properties:
        status:
          const: BLOCKED
      required:
        - status
    then:
      properties:
        next_action:
          $ref: '#/$defs/nextAction'
        stop_reason:
          allOf:
            - $ref: '#/$defs/stopReason'
            - type: object
              properties:
                code:
                  enum:
                    - BLOCKED
                    - MISSING_DEPENDENCY
                    - REPOSITORY_DIVERGENCE
                    - UNSAFE_ACTION
                    - REPEATED_NO_PROGRESS
                    - REPEATED_INSUFFICIENT_EVIDENCE
  - if:
      properties:
        status:
          const: FAILED
      required:
        - status
    then:
      properties:
        completion_verdict:
          enum:
            - FAIL
            - INSUFFICIENT_EVIDENCE
        stop_reason:
          allOf:
            - $ref: '#/$defs/stopReason'
            - type: object
              properties:
                code:
                  const: FAILED
  - if:
      properties:
        status:
          const: CANCELLED
      required:
        - status
    then:
      properties:
        next_action:
          type: 'null'
        stop_reason:
          allOf:
            - $ref: '#/$defs/stopReason'
            - type: object
              properties:
                code:
                  const: CANCELLED
$defs:
  nonEmptyString:
    type: string
    minLength: 1
    maxLength: 4096
  stableId:
    type: string
    minLength: 1
    maxLength: 128
    pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
  relativePath:
    type: string
    minLength: 1
    maxLength: 2048
    pattern: '^(?![A-Za-z]:[\\/])(?![\\/])(?!.*(?:^|[\\/])\.\.(?:[\\/]|$)).+$'
  locationReference:
    type: object
    additionalProperties: false
    required:
      - kind
      - ref
      - description
    properties:
      kind:
        enum:
          - REPOSITORY_PATH
          - ARTIFACT_PATH
          - URI
          - GIT_COMMIT
          - PULL_REQUEST
          - COMMAND_RESULT
          - EXTERNAL_RESOURCE
      ref:
        type: string
        minLength: 1
        maxLength: 2048
      description:
        $ref: '#/$defs/nonEmptyString'
      revision:
        type: [string, 'null']
        maxLength: 256
      sha256:
        type: [string, 'null']
        pattern: '^[A-Fa-f0-9]{64}$'
    allOf:
      - if:
          properties:
            kind:
              const: URI
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              format: uri
      - if:
          properties:
            kind:
              enum:
                - REPOSITORY_PATH
                - ARTIFACT_PATH
                - COMMAND_RESULT
          required:
            - kind
        then:
          properties:
            ref:
              $ref: '#/$defs/relativePath'
      - if:
          properties:
            kind:
              const: GIT_COMMIT
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              pattern: '^[A-Fa-f0-9]{7,64}$'
      - if:
          properties:
            kind:
              const: PULL_REQUEST
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              format: uri
  evidenceReference:
    type: object
    additionalProperties: false
    required:
      - kind
      - ref
      - description
      - verdict
      - observed_at
    properties:
      kind:
        enum:
          - REPOSITORY_PATH
          - ARTIFACT_PATH
          - URI
          - GIT_COMMIT
          - PULL_REQUEST
          - COMMAND_RESULT
          - EXTERNAL_RESOURCE
      ref:
        type: string
        minLength: 1
        maxLength: 2048
      description:
        $ref: '#/$defs/nonEmptyString'
      revision:
        type: [string, 'null']
        maxLength: 256
      sha256:
        type: [string, 'null']
        pattern: '^[A-Fa-f0-9]{64}$'
      verdict:
        enum:
          - PASS
          - FAIL
          - INSUFFICIENT_EVIDENCE
          - NOT_EVALUATED
      observed_at:
        type: string
        format: date-time
    allOf:
      - if:
          properties:
            kind:
              const: URI
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              format: uri
      - if:
          properties:
            kind:
              enum:
                - REPOSITORY_PATH
                - ARTIFACT_PATH
                - COMMAND_RESULT
          required:
            - kind
        then:
          properties:
            ref:
              $ref: '#/$defs/relativePath'
      - if:
          properties:
            kind:
              const: GIT_COMMIT
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              pattern: '^[A-Fa-f0-9]{7,64}$'
      - if:
          properties:
            kind:
              const: PULL_REQUEST
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              format: uri
  completedItem:
    type: object
    additionalProperties: false
    required:
      - id
      - summary
      - verdict
      - evidence_refs
      - completed_at
    properties:
      id:
        $ref: '#/$defs/stableId'
      summary:
        $ref: '#/$defs/nonEmptyString'
      verdict:
        const: PASS
      evidence_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          $ref: '#/$defs/locationReference'
      completed_at:
        type: string
        format: date-time
  failedCheck:
    type: object
    additionalProperties: false
    required:
      - check_id
      - criterion_id
      - verdict
      - summary
      - evidence_refs
      - smallest_correction
      - release_blocking
    properties:
      check_id:
        $ref: '#/$defs/stableId'
      criterion_id:
        $ref: '#/$defs/stableId'
      verdict:
        enum:
          - FAIL
          - INSUFFICIENT_EVIDENCE
      summary:
        $ref: '#/$defs/nonEmptyString'
      evidence_refs:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/locationReference'
      smallest_correction:
        $ref: '#/$defs/nonEmptyString'
      release_blocking:
        type: boolean
  remainingItem:
    type: object
    additionalProperties: false
    required:
      - id
      - description
      - blocking
      - dependencies
      - output_refs
    properties:
      id:
        $ref: '#/$defs/stableId'
      description:
        $ref: '#/$defs/nonEmptyString'
      blocking:
        type: boolean
      dependencies:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/stableId'
      output_refs:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/locationReference'
  pendingApproval:
    type: object
    additionalProperties: false
    required:
      - approval_id
      - action_class
      - action
      - target
      - status
      - requested_at
    properties:
      approval_id:
        $ref: '#/$defs/stableId'
      action_class:
        enum:
          - WRITE
          - COMMIT
          - PUSH
          - CREATE_PR
          - UPDATE_PR
          - MERGE
          - RELEASE
          - DEPLOY
          - VISIBILITY_CHANGE
          - EXTERNAL_MESSAGE
          - PURCHASE
          - PRODUCTION_MUTATION
          - DESTRUCTIVE_ACTION
          - SECRET_HANDLING
          - OTHER_EXTERNAL_WRITE
          - IRREVERSIBLE_OR_HIGH_CONSEQUENCE
      action:
        $ref: '#/$defs/nonEmptyString'
      target:
        $ref: '#/$defs/nonEmptyString'
      status:
        enum:
          - REQUIRED
          - REQUESTED
      requested_at:
        type: [string, 'null']
        format: date-time
      evidence_refs:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/locationReference'
  budgetState:
    type: object
    additionalProperties: false
    required:
      - limits
      - consumed
      - exhausted_dimensions
    properties:
      limits:
        $ref: '#/$defs/budgetDimensions'
      consumed:
        $ref: '#/$defs/budgetDimensions'
      exhausted_dimensions:
        type: array
        uniqueItems: true
        items:
          enum:
            - ITERATIONS
            - ELAPSED_SECONDS
            - INPUT_TOKENS
            - OUTPUT_TOKENS
            - TOTAL_TOKENS
            - COST
  budgetDimensions:
    type: object
    additionalProperties: false
    required:
      - iterations
      - elapsed_seconds
      - input_tokens
      - output_tokens
      - total_tokens
      - cost
    properties:
      iterations:
        type: [integer, 'null']
        minimum: 0
      elapsed_seconds:
        type: [number, 'null']
        minimum: 0
      input_tokens:
        type: [integer, 'null']
        minimum: 0
      output_tokens:
        type: [integer, 'null']
        minimum: 0
      total_tokens:
        type: [integer, 'null']
        minimum: 0
      cost:
        anyOf:
          - type: 'null'
          - $ref: '#/$defs/money'
  money:
    type: object
    additionalProperties: false
    required:
      - amount
      - currency
    properties:
      amount:
        type: number
        minimum: 0
      currency:
        type: string
        pattern: '^[A-Z]{3}$'
  durabilityState:
    type: object
    additionalProperties: false
    required:
      - authority
      - host_state_ref
      - last_transition_id
      - event_seq
      - outbox_reconciliation
      - action_reconciliation
    properties:
      authority:
        enum:
          - WORK_PROJECT_ARTIFACT
          - TRUSTED_HOST_REFERENCE
      host_state_ref:
        anyOf:
          - $ref: '#/$defs/locationReference'
          - type: 'null'
      last_transition_id:
        type: [string, 'null']
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      event_seq:
        type: [integer, 'null']
        minimum: 0
      outbox_reconciliation:
        enum:
          - NOT_APPLICABLE
          - CLEAR
          - RECONCILIATION_REQUIRED
          - BLOCKED
      action_reconciliation:
        enum:
          - NOT_APPLICABLE
          - CLEAR
          - RECONCILIATION_REQUIRED
          - BLOCKED
    allOf:
      - if:
          properties:
            authority:
              const: WORK_PROJECT_ARTIFACT
          required:
            - authority
        then:
          properties:
            host_state_ref:
              type: 'null'
            outbox_reconciliation:
              const: NOT_APPLICABLE
            action_reconciliation:
              const: NOT_APPLICABLE
      - if:
          properties:
            authority:
              const: TRUSTED_HOST_REFERENCE
          required:
            - authority
        then:
          properties:
            host_state_ref:
              $ref: '#/$defs/locationReference'
            last_transition_id:
              type: string
            event_seq:
              type: integer
  nextAction:
    type: object
    additionalProperties: false
    required:
      - action
      - owner
      - requires_approval
      - evidence_to_collect
    properties:
      action:
        $ref: '#/$defs/nonEmptyString'
      owner:
        enum:
          - WORK_GENERATOR
          - WORK_VERIFIER
          - LOCAL_CODEX
          - TRUSTED_HOST
          - HUMAN
      requires_approval:
        type: boolean
      evidence_to_collect:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
  stopReason:
    type: object
    additionalProperties: false
    required:
      - code
      - summary
      - evidence_refs
    properties:
      code:
        enum:
          - COMPLETED
          - REVIEW_REQUIRED
          - BLOCKED
          - APPROVAL_REQUIRED
          - BUDGET_EXHAUSTED
          - FAILED
          - CANCELLED
          - MISSING_DEPENDENCY
          - REPOSITORY_DIVERGENCE
          - UNSAFE_ACTION
          - REPEATED_NO_PROGRESS
          - REPEATED_INSUFFICIENT_EVIDENCE
      summary:
        $ref: '#/$defs/nonEmptyString'
      evidence_refs:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/locationReference'
