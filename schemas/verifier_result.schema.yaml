$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/Denys/UPE_v5.6/schemas/verifier_result.schema.yaml
title: UPE Read-Only Verifier Result
description: >-
  Criterion-level result from an independent, read-only verifier. The result
  preserves the frozen criteria, cites inspected evidence, and distinguishes
  failure from insufficient evidence without granting write authority.
type: object
additionalProperties: false
required:
  - schema_version
  - result_id
  - goal_id
  - task_id
  - evaluator
  - goal_contract_ref
  - artifact_refs
  - criteria
  - overall_verdict
  - release_blocking
  - smallest_correction
  - insufficient_evidence
  - scope_preserved
  - criteria_preserved
  - evaluated_at
  - budget_usage
properties:
  schema_version:
    const: 1.0.0
  result_id:
    $ref: '#/$defs/stableId'
  goal_id:
    $ref: '#/$defs/stableId'
  task_id:
    anyOf:
      - $ref: '#/$defs/stableId'
      - type: 'null'
  evaluator:
    type: object
    additionalProperties: false
    required:
      - evaluator_id
      - kind
      - independent_from_generator
      - access_mode
      - actual_artifact_inspection
    properties:
      evaluator_id:
        $ref: '#/$defs/stableId'
      kind:
        enum:
          - DETERMINISTIC_VALIDATOR
          - MODEL_EVALUATOR
          - HUMAN_REVIEWER
      independent_from_generator:
        const: true
      access_mode:
        const: READ_ONLY
      actual_artifact_inspection:
        type: boolean
      runtime_identity:
        type: [string, 'null']
        maxLength: 512
  goal_contract_ref:
    $ref: '#/$defs/locationReference'
  artifact_refs:
    description: Actual artifacts or environment evidence inspected by the verifier.
    type: array
    items:
      $ref: '#/$defs/locationReference'
  criteria:
    type: array
    minItems: 1
    items:
      $ref: '#/$defs/criterionResult'
  overall_verdict:
    enum:
      - PASS
      - FAIL
      - INSUFFICIENT_EVIDENCE
  release_blocking:
    type: boolean
  smallest_correction:
    anyOf:
      - $ref: '#/$defs/correction'
      - type: 'null'
  insufficient_evidence:
    description: Missing evidence items aggregated across criterion results.
    type: array
    uniqueItems: true
    items:
      $ref: '#/$defs/nonEmptyString'
  scope_preserved:
    description: The verifier did not add requirements outside the frozen goal contract.
    const: true
  criteria_preserved:
    description: The verifier did not rewrite or remove the supplied acceptance criteria.
    const: true
  evaluated_at:
    type: string
    format: date-time
  budget_usage:
    $ref: '#/$defs/budgetUsage'
allOf:
  - if:
      properties:
        overall_verdict:
          const: PASS
      required:
        - overall_verdict
    then:
      properties:
        criteria:
          not:
            type: array
            contains:
              type: object
              properties:
                verdict:
                  enum:
                    - FAIL
                    - INSUFFICIENT_EVIDENCE
              required:
                - verdict
        release_blocking:
          const: false
        smallest_correction:
          type: 'null'
        insufficient_evidence:
          type: array
          maxItems: 0
  - if:
      properties:
        overall_verdict:
          const: FAIL
      required:
        - overall_verdict
    then:
      properties:
        criteria:
          type: array
          contains:
            type: object
            properties:
              verdict:
                const: FAIL
            required:
              - verdict
          minContains: 1
        smallest_correction:
          $ref: '#/$defs/correction'
  - if:
      properties:
        overall_verdict:
          const: INSUFFICIENT_EVIDENCE
      required:
        - overall_verdict
    then:
      properties:
        criteria:
          type: array
          allOf:
            - type: array
              contains:
                type: object
                properties:
                  verdict:
                    const: INSUFFICIENT_EVIDENCE
                required:
                  - verdict
              minContains: 1
            - not:
                type: array
                contains:
                  type: object
                  properties:
                    verdict:
                      const: FAIL
                  required:
                    - verdict
        smallest_correction:
          $ref: '#/$defs/correction'
        insufficient_evidence:
          type: array
          minItems: 1
  - if:
      properties:
        criteria:
          type: array
          contains:
            type: object
            properties:
              release_blocking:
                const: true
            required:
              - release_blocking
      required:
        - criteria
    then:
      properties:
        release_blocking:
          const: true
    else:
      properties:
        release_blocking:
          const: false
$defs:
  nonEmptyString:
    type: string
    minLength: 1
    maxLength: 4096
  stableId:
    type: string
    minLength: 1
    maxLength: 128
    pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
  relativePath:
    type: string
    minLength: 1
    maxLength: 2048
    pattern: '^(?![A-Za-z]:[\\/])(?![\\/])(?!.*(?:^|[\\/])\.\.(?:[\\/]|$)).+$'
  locationReference:
    type: object
    additionalProperties: false
    required:
      - kind
      - ref
      - description
    properties:
      kind:
        enum:
          - REPOSITORY_PATH
          - ARTIFACT_PATH
          - URI
          - GIT_COMMIT
          - PULL_REQUEST
          - COMMAND_RESULT
          - EXTERNAL_RESOURCE
      ref:
        type: string
        minLength: 1
        maxLength: 2048
      description:
        $ref: '#/$defs/nonEmptyString'
      revision:
        type: [string, 'null']
        maxLength: 256
      sha256:
        type: [string, 'null']
        pattern: '^[A-Fa-f0-9]{64}$'
    allOf:
      - if:
          properties:
            kind:
              const: URI
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              format: uri
      - if:
          properties:
            kind:
              enum:
                - REPOSITORY_PATH
                - ARTIFACT_PATH
                - COMMAND_RESULT
          required:
            - kind
        then:
          properties:
            ref:
              $ref: '#/$defs/relativePath'
      - if:
          properties:
            kind:
              const: GIT_COMMIT
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              pattern: '^[A-Fa-f0-9]{7,64}$'
      - if:
          properties:
            kind:
              const: PULL_REQUEST
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              format: uri
  correction:
    type: object
    additionalProperties: false
    required:
      - action
      - owner
      - target_refs
      - verification
    properties:
      action:
        $ref: '#/$defs/nonEmptyString'
      owner:
        enum:
          - GENERATOR
          - LOCAL_CODEX
          - TRUSTED_HOST
          - HUMAN
      target_refs:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/locationReference'
      verification:
        $ref: '#/$defs/nonEmptyString'
  criterionResult:
    type: object
    additionalProperties: false
    required:
      - criterion_id
      - statement
      - mandatory
      - verdict
      - evidence_refs
      - missing_evidence
      - smallest_correction
      - release_blocking
    properties:
      criterion_id:
        $ref: '#/$defs/stableId'
      statement:
        $ref: '#/$defs/nonEmptyString'
      mandatory:
        type: boolean
      verdict:
        enum:
          - PASS
          - FAIL
          - INSUFFICIENT_EVIDENCE
      evidence_refs:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/locationReference'
      missing_evidence:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
      smallest_correction:
        anyOf:
          - $ref: '#/$defs/correction'
          - type: 'null'
      release_blocking:
        type: boolean
    allOf:
      - if:
          properties:
            verdict:
              const: PASS
          required:
            - verdict
        then:
          properties:
            evidence_refs:
              type: array
              minItems: 1
            missing_evidence:
              type: array
              maxItems: 0
            smallest_correction:
              type: 'null'
            release_blocking:
              const: false
      - if:
          properties:
            verdict:
              const: FAIL
          required:
            - verdict
        then:
          properties:
            evidence_refs:
              type: array
              minItems: 1
            smallest_correction:
              $ref: '#/$defs/correction'
      - if:
          properties:
            verdict:
              const: INSUFFICIENT_EVIDENCE
          required:
            - verdict
        then:
          properties:
            missing_evidence:
              type: array
              minItems: 1
            smallest_correction:
              $ref: '#/$defs/correction'
      - if:
          properties:
            mandatory:
              const: true
            verdict:
              enum:
                - FAIL
                - INSUFFICIENT_EVIDENCE
          required:
            - mandatory
            - verdict
        then:
          properties:
            release_blocking:
              const: true
  budgetUsage:
    type: object
    additionalProperties: false
    required:
      - elapsed_seconds
      - input_tokens
      - output_tokens
      - cost
    properties:
      elapsed_seconds:
        type: [number, 'null']
        minimum: 0
      input_tokens:
        type: [integer, 'null']
        minimum: 0
      output_tokens:
        type: [integer, 'null']
        minimum: 0
      cost:
        anyOf:
          - type: 'null'
          - $ref: '#/$defs/money'
  money:
    type: object
    additionalProperties: false
    required:
      - amount
      - currency
    properties:
      amount:
        type: number
        minimum: 0
      currency:
        type: string
        pattern: '^[A-Z]{3}$'
