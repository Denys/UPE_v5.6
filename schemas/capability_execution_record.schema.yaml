$schema: https://json-schema.org/draft/2020-12/schema
$id: https://github.com/Denys/UPE_v5.6/schemas/capability_execution_record.schema.yaml
title: UPE Capability Execution Record
description: >-
  Evidence-backed record of a capability's actual exposure, permission and
  action boundaries, execution outcome, validation, fallback, and residual
  limits on one observed surface. Planned availability is never treated as
  actual exposure.
type: object
additionalProperties: false
required:
  - schema_version
  - record_id
  - goal_id
  - run_id
  - task_id
  - surface
  - capability
  - exposure
  - permission
  - action_boundary
  - execution
  - validation
  - fallback
  - residual_limits
  - evidence
  - budget_usage
  - recorded_at
properties:
  schema_version:
    const: 1.0.0
  record_id:
    $ref: '#/$defs/stableId'
  goal_id:
    $ref: '#/$defs/stableId'
  run_id:
    anyOf:
      - $ref: '#/$defs/stableId'
      - type: 'null'
  task_id:
    anyOf:
      - $ref: '#/$defs/stableId'
      - type: 'null'
  surface:
    $ref: '#/$defs/surface'
  capability:
    $ref: '#/$defs/capability'
  exposure:
    $ref: '#/$defs/exposure'
  permission:
    $ref: '#/$defs/permission'
  action_boundary:
    $ref: '#/$defs/actionBoundary'
  execution:
    $ref: '#/$defs/execution'
  validation:
    $ref: '#/$defs/validation'
  fallback:
    $ref: '#/$defs/fallback'
  residual_limits:
    type: array
    items:
      $ref: '#/$defs/residualLimit'
  evidence:
    description: Aggregate evidence supporting exposure, permission, execution, and validation claims.
    type: array
    items:
      $ref: '#/$defs/locationReference'
  budget_usage:
    $ref: '#/$defs/budgetUsage'
  recorded_at:
    type: string
    format: date-time
allOf:
  - if:
      properties:
        exposure:
          type: object
          properties:
            status:
              enum:
                - VERIFIED_UNAVAILABLE
                - BLOCKED
                - UNKNOWN
          required:
            - status
      required:
        - exposure
    then:
      properties:
        execution:
          type: object
          properties:
            status:
              enum:
                - NOT_ATTEMPTED
                - SKIPPED
                - BLOCKED
                - FAILED
          required:
            - status
  - if:
      properties:
        permission:
          type: object
          properties:
            state:
              enum:
                - DENIED
                - REQUIRES_APPROVAL
                - UNKNOWN
          required:
            - state
      required:
        - permission
    then:
      properties:
        execution:
          type: object
          required:
            - status
            - side_effects
          properties:
            status:
              enum:
                - NOT_ATTEMPTED
                - SKIPPED
                - BLOCKED
            side_effects:
              type: array
              maxItems: 0
  - if:
      properties:
        execution:
          type: object
          properties:
            side_effects:
              type: array
              contains:
                type: object
                properties:
                  occurred:
                    const: true
                  authorization_required:
                    const: true
                required:
                  - occurred
                  - authorization_required
          required:
            - side_effects
      required:
        - execution
    then:
      properties:
        permission:
          type: object
          properties:
            state:
              const: AUTHORIZED
            approval_required:
              const: true
            authorization_ref:
              $ref: '#/$defs/locationReference'
            scope:
              type: array
              minItems: 1
          required:
            - state
            - approval_required
            - authorization_ref
            - scope
        action_boundary:
          type: object
          properties:
            side_effect_owner:
              enum:
                - TRUSTED_HOST
                - COORDINATOR
                - HUMAN
          required:
            - side_effect_owner
        execution:
          type: object
          properties:
            action_id:
              type: string
          required:
            - action_id
  - if:
      properties:
        capability:
          type: object
          properties:
            requirement:
              const: AVOID_OR_DISABLE
          required:
            - requirement
      required:
        - capability
    then:
      properties:
        execution:
          type: object
          properties:
            status:
              enum:
                - NOT_ATTEMPTED
                - SKIPPED
                - BLOCKED
          required:
            - status
$defs:
  nonEmptyString:
    type: string
    minLength: 1
    maxLength: 4096
  stableId:
    type: string
    minLength: 1
    maxLength: 128
    pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
  relativePath:
    type: string
    minLength: 1
    maxLength: 2048
    pattern: '^(?![A-Za-z]:[\\/])(?![\\/])(?!.*(?:^|[\\/])\.\.(?:[\\/]|$)).+$'
  locationReference:
    type: object
    additionalProperties: false
    required:
      - kind
      - ref
      - description
    properties:
      kind:
        enum:
          - REPOSITORY_PATH
          - ARTIFACT_PATH
          - URI
          - GIT_COMMIT
          - PULL_REQUEST
          - COMMAND_RESULT
          - EXTERNAL_RESOURCE
      ref:
        type: string
        minLength: 1
        maxLength: 2048
      description:
        $ref: '#/$defs/nonEmptyString'
      revision:
        type: [string, 'null']
        maxLength: 256
      sha256:
        type: [string, 'null']
        pattern: '^[A-Fa-f0-9]{64}$'
    allOf:
      - if:
          properties:
            kind:
              const: URI
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              format: uri
      - if:
          properties:
            kind:
              enum:
                - REPOSITORY_PATH
                - ARTIFACT_PATH
                - COMMAND_RESULT
          required:
            - kind
        then:
          properties:
            ref:
              $ref: '#/$defs/relativePath'
      - if:
          properties:
            kind:
              const: GIT_COMMIT
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              pattern: '^[A-Fa-f0-9]{7,64}$'
      - if:
          properties:
            kind:
              const: PULL_REQUEST
          required:
            - kind
        then:
          properties:
            ref:
              type: string
              format: uri
  surface:
    type: object
    additionalProperties: false
    required:
      - kind
      - mode
      - label
      - observed_at
    properties:
      kind:
        enum:
          - CHATGPT_WORK_WEB
          - CHATGPT_WEB
          - CHATGPT_DESKTOP
          - CHATGPT_MOBILE
          - LOCAL_CODEX
          - API
          - CUSTOM_GPT
          - OTHER
          - UNKNOWN
      mode:
        enum:
          - WEB
          - DESKTOP
          - MOBILE
          - LOCAL
          - API
          - UNKNOWN
      label:
        type: [string, 'null']
        maxLength: 256
      observed_at:
        type: string
        format: date-time
    allOf:
      - if:
          properties:
            kind:
              const: OTHER
          required:
            - kind
        then:
          properties:
            label:
              type: string
              minLength: 1
  capability:
    type: object
    additionalProperties: false
    required:
      - capability_id
      - name
      - kind
      - requirement
      - purpose
    properties:
      capability_id:
        $ref: '#/$defs/stableId'
      name:
        $ref: '#/$defs/nonEmptyString'
      kind:
        enum:
          - BUILT_IN_TOOL
          - SKILL
          - PLUGIN
          - APP
          - CONNECTOR
          - MCP
          - REPOSITORY
          - ARTIFACT
          - BROWSER
          - AGENT
          - AUTOMATION
          - OTHER
      requirement:
        enum:
          - REQUIRED
          - OPTIONAL
          - AVOID_OR_DISABLE
      purpose:
        $ref: '#/$defs/nonEmptyString'
  exposure:
    type: object
    additionalProperties: false
    required:
      - status
      - verification_method
      - verified_at
      - evidence_refs
      - unknown_reason
    properties:
      status:
        enum:
          - VERIFIED_AVAILABLE
          - VERIFIED_UNAVAILABLE
          - DEGRADED
          - BLOCKED
          - UNKNOWN
      verification_method:
        enum:
          - TOOL_INVENTORY
          - DIRECT_PROBE
          - CONNECTOR_METADATA
          - REPOSITORY_INSPECTION
          - OFFICIAL_DOCUMENTATION
          - NOT_VERIFIED
      verified_at:
        type: [string, 'null']
        format: date-time
      evidence_refs:
        type: array
        items:
          $ref: '#/$defs/locationReference'
      unknown_reason:
        type: [string, 'null']
        maxLength: 4096
    allOf:
      - if:
          properties:
            status:
              enum:
                - VERIFIED_AVAILABLE
                - VERIFIED_UNAVAILABLE
                - DEGRADED
                - BLOCKED
          required:
            - status
        then:
          properties:
            verification_method:
              not:
                const: NOT_VERIFIED
            verified_at:
              type: string
            evidence_refs:
              type: array
              minItems: 1
            unknown_reason:
              type: 'null'
      - if:
          properties:
            status:
              const: VERIFIED_AVAILABLE
          required:
            - status
        then:
          properties:
            verification_method:
              enum:
                - TOOL_INVENTORY
                - DIRECT_PROBE
                - CONNECTOR_METADATA
                - REPOSITORY_INSPECTION
      - if:
          properties:
            status:
              const: UNKNOWN
          required:
            - status
        then:
          properties:
            verification_method:
              const: NOT_VERIFIED
            verified_at:
              type: 'null'
            unknown_reason:
              type: string
              minLength: 1
  permission:
    type: object
    additionalProperties: false
    required:
      - action_scope
      - state
      - scope
      - approval_required
      - authorization_ref
      - enforcement_owner
      - expires_at
    properties:
      action_scope:
        enum:
          - NONE
          - READ_ONLY
          - TRANSFORM_ONLY
          - DRAFT
          - WRITE
          - CONSEQUENTIAL
          - IRREVERSIBLE
      state:
        enum:
          - NOT_APPLICABLE
          - NOT_REQUIRED
          - REQUIRES_APPROVAL
          - AUTHORIZED
          - DENIED
          - UNKNOWN
      scope:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
      approval_required:
        type: boolean
      authorization_ref:
        anyOf:
          - $ref: '#/$defs/locationReference'
          - type: 'null'
      enforcement_owner:
        enum:
          - TRUSTED_HOST
          - COORDINATOR
          - HUMAN
          - RUNTIME_POLICY
          - NONE
      expires_at:
        type: [string, 'null']
        format: date-time
    allOf:
      - if:
          properties:
            state:
              const: NOT_REQUIRED
          required:
            - state
        then:
          properties:
            approval_required:
              const: false
      - if:
          properties:
            state:
              const: REQUIRES_APPROVAL
          required:
            - state
        then:
          properties:
            approval_required:
              const: true
      - if:
          properties:
            state:
              const: AUTHORIZED
            approval_required:
              const: true
          required:
            - state
            - approval_required
        then:
          properties:
            authorization_ref:
              $ref: '#/$defs/locationReference'
            scope:
              type: array
              minItems: 1
      - if:
          properties:
            action_scope:
              enum:
                - WRITE
                - CONSEQUENTIAL
                - IRREVERSIBLE
          required:
            - action_scope
        then:
          properties:
            state:
              enum:
                - REQUIRES_APPROVAL
                - AUTHORIZED
                - DENIED
                - UNKNOWN
            approval_required:
              const: true
  actionBoundary:
    type: object
    additionalProperties: false
    required:
      - allowed_actions
      - approval_gated_actions
      - forbidden_actions
      - side_effect_owner
      - network_access
      - filesystem_scope
    properties:
      allowed_actions:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
      approval_gated_actions:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
      forbidden_actions:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/nonEmptyString'
      side_effect_owner:
        enum:
          - TRUSTED_HOST
          - COORDINATOR
          - HUMAN
          - NONE
      network_access:
        enum:
          - DENIED
          - ENABLED_SCOPED
          - UNKNOWN
      filesystem_scope:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/locationReference'
  execution:
    type: object
    additionalProperties: false
    required:
      - status
      - action_id
      - operation
      - started_at
      - completed_at
      - side_effects
      - provider_result_ref
      - error
    properties:
      status:
        enum:
          - NOT_ATTEMPTED
          - SKIPPED
          - BLOCKED
          - SUCCEEDED
          - FAILED
          - PARTIAL
      action_id:
        anyOf:
          - $ref: '#/$defs/stableId'
          - type: 'null'
      operation:
        type: [string, 'null']
        maxLength: 4096
      started_at:
        type: [string, 'null']
        format: date-time
      completed_at:
        type: [string, 'null']
        format: date-time
      side_effects:
        type: array
        items:
          $ref: '#/$defs/sideEffect'
      provider_result_ref:
        anyOf:
          - $ref: '#/$defs/locationReference'
          - type: 'null'
      error:
        anyOf:
          - $ref: '#/$defs/executionError'
          - type: 'null'
    allOf:
      - if:
          properties:
            status:
              enum:
                - NOT_ATTEMPTED
                - SKIPPED
                - BLOCKED
          required:
            - status
        then:
          properties:
            started_at:
              type: 'null'
            completed_at:
              type: 'null'
            side_effects:
              type: array
              maxItems: 0
      - if:
          properties:
            status:
              enum:
                - SUCCEEDED
                - FAILED
                - PARTIAL
          required:
            - status
        then:
          properties:
            operation:
              type: string
              minLength: 1
            started_at:
              type: string
            completed_at:
              type: string
      - if:
          properties:
            status:
              const: SUCCEEDED
          required:
            - status
        then:
          properties:
            error:
              type: 'null'
      - if:
          properties:
            status:
              const: FAILED
          required:
            - status
        then:
          properties:
            error:
              $ref: '#/$defs/executionError'
  sideEffect:
    type: object
    additionalProperties: false
    required:
      - effect_id
      - action
      - target
      - occurred
      - authorization_required
      - result_ref
    properties:
      effect_id:
        $ref: '#/$defs/stableId'
      action:
        $ref: '#/$defs/nonEmptyString'
      target:
        $ref: '#/$defs/nonEmptyString'
      occurred:
        type: boolean
      authorization_required:
        type: boolean
      result_ref:
        anyOf:
          - $ref: '#/$defs/locationReference'
          - type: 'null'
  executionError:
    type: object
    additionalProperties: false
    required:
      - category
      - message
      - evidence_refs
    properties:
      category:
        enum:
          - CAPABILITY_UNAVAILABLE
          - PERMISSION_DENIED
          - APPROVAL_REQUIRED
          - INVALID_INPUT
          - TRANSIENT
          - POLICY_BLOCK
          - PROVIDER_ERROR
          - UNKNOWN
      message:
        $ref: '#/$defs/nonEmptyString'
      evidence_refs:
        type: array
        items:
          $ref: '#/$defs/locationReference'
  validation:
    type: object
    additionalProperties: false
    required:
      - verdict
      - method
      - checks
      - evidence_refs
      - validated_at
    properties:
      verdict:
        enum:
          - PASS
          - FAIL
          - INSUFFICIENT_EVIDENCE
          - NOT_RUN
      method:
        enum:
          - DETERMINISTIC
          - PROVIDER_CONFIRMATION
          - READ_ONLY_REVIEW
          - NONE
      checks:
        type: array
        items:
          $ref: '#/$defs/validationCheck'
      evidence_refs:
        type: array
        items:
          $ref: '#/$defs/locationReference'
      validated_at:
        type: [string, 'null']
        format: date-time
    allOf:
      - if:
          properties:
            verdict:
              const: NOT_RUN
          required:
            - verdict
        then:
          properties:
            method:
              const: NONE
            checks:
              type: array
              maxItems: 0
            evidence_refs:
              type: array
              maxItems: 0
            validated_at:
              type: 'null'
      - if:
          properties:
            verdict:
              const: PASS
          required:
            - verdict
        then:
          properties:
            method:
              not:
                const: NONE
            checks:
              type: array
              minItems: 1
            evidence_refs:
              type: array
              minItems: 1
            validated_at:
              type: string
  validationCheck:
    type: object
    additionalProperties: false
    required:
      - check_id
      - verdict
      - summary
      - evidence_refs
    properties:
      check_id:
        $ref: '#/$defs/stableId'
      verdict:
        enum:
          - PASS
          - FAIL
          - INSUFFICIENT_EVIDENCE
      summary:
        $ref: '#/$defs/nonEmptyString'
      evidence_refs:
        type: array
        items:
          $ref: '#/$defs/locationReference'
  fallback:
    type: object
    additionalProperties: false
    required:
      - status
      - description
      - capability_ids
      - evidence_refs
      - validation_verdict
    properties:
      status:
        enum:
          - NOT_NEEDED
          - READY
          - USED
          - FAILED
          - UNAVAILABLE
      description:
        type: [string, 'null']
        maxLength: 4096
      capability_ids:
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/stableId'
      evidence_refs:
        type: array
        items:
          $ref: '#/$defs/locationReference'
      validation_verdict:
        enum:
          - PASS
          - FAIL
          - INSUFFICIENT_EVIDENCE
          - NOT_RUN
    allOf:
      - if:
          properties:
            status:
              const: NOT_NEEDED
          required:
            - status
        then:
          properties:
            description:
              type: 'null'
            capability_ids:
              type: array
              maxItems: 0
            evidence_refs:
              type: array
              maxItems: 0
            validation_verdict:
              const: NOT_RUN
      - if:
          properties:
            status:
              enum:
                - READY
                - USED
                - FAILED
                - UNAVAILABLE
          required:
            - status
        then:
          properties:
            description:
              type: string
              minLength: 1
      - if:
          properties:
            status:
              const: USED
          required:
            - status
        then:
          properties:
            validation_verdict:
              not:
                const: NOT_RUN
            evidence_refs:
              type: array
              minItems: 1
  residualLimit:
    type: object
    additionalProperties: false
    required:
      - limit_id
      - description
      - severity
      - mitigation
      - release_blocking
    properties:
      limit_id:
        $ref: '#/$defs/stableId'
      description:
        $ref: '#/$defs/nonEmptyString'
      severity:
        enum:
          - INFORMATIONAL
          - WARNING
          - BLOCKING
      mitigation:
        type: [string, 'null']
        maxLength: 4096
      release_blocking:
        type: boolean
    allOf:
      - if:
          properties:
            severity:
              const: BLOCKING
          required:
            - severity
        then:
          properties:
            release_blocking:
              const: true
  budgetUsage:
    type: object
    additionalProperties: false
    required:
      - calls
      - elapsed_seconds
      - input_tokens
      - output_tokens
      - cost
    properties:
      calls:
        type: [integer, 'null']
        minimum: 0
      elapsed_seconds:
        type: [number, 'null']
        minimum: 0
      input_tokens:
        type: [integer, 'null']
        minimum: 0
      output_tokens:
        type: [integer, 'null']
        minimum: 0
      cost:
        anyOf:
          - type: 'null'
          - $ref: '#/$defs/money'
  money:
    type: object
    additionalProperties: false
    required:
      - amount
      - currency
    properties:
      amount:
        type: number
        minimum: 0
      currency:
        type: string
        pattern: '^[A-Z]{3}$'
